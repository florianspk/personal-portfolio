<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" width="200" height="200">
  <defs>
    <linearGradient id="gbg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#1a3a6b"/>
      <stop offset="100%" style="stop-color:#0d2444"/>
    </linearGradient>
  </defs>
  <!-- Hexagon background -->
  <polygon points="100,8 182,53 182,147 100,192 18,147 18,53" fill="url(#gbg)" stroke="#4285f4" stroke-width="2.5"/>
  <polygon points="100,20 170,60 170,140 100,180 30,140 30,60" fill="none" stroke="rgba(66,133,244,0.3)" stroke-width="1"/>
  <!-- Google Cloud wheel/gear icon simplified -->
  <circle cx="100" cy="82" r="20" fill="none" stroke="#4285f4" stroke-width="3"/>
  <circle cx="100" cy="82" r="9" fill="#4285f4"/>
  <!-- Wheel spokes -->
  <rect x="97" y="56" width="6" height="10" rx="3" fill="#4285f4"/>
  <rect x="97" y="98" width="6" height="10" rx="3" fill="#4285f4"/>
  <rect x="74" y="79" width="10" height="6" rx="3" fill="#4285f4"/>
  <rect x="116" y="79" width="10" height="6" rx="3" fill="#4285f4"/>
  <rect x="80.5" y="62.5" width="10" height="6" rx="3" fill="#4285f4" transform="rotate(45 85.5 65.5)"/>
  <rect x="80.5" y="93.5" width="10" height="6" rx="3" fill="#4285f4" transform="rotate(-45 85.5 96.5)"/>
  <rect x="109.5" y="62.5" width="10" height="6" rx="3" fill="#4285f4" transform="rotate(-45 114.5 65.5)"/>
  <rect x="109.5" y="93.5" width="10" height="6" rx="3" fill="#4285f4" transform="rotate(45 114.5 96.5)"/>
  <!-- Google colors band at bottom of icon -->
  <rect x="72" y="104" width="8" height="4" rx="2" fill="#ea4335"/>
  <rect x="82" y="104" width="8" height="4" rx="2" fill="#fbbc04"/>
  <rect x="92" y="104" width="8" height="4" rx="2" fill="#34a853"/>
  <rect x="102" y="104" width="8" height="4" rx="2" fill="#4285f4"/>
  <rect x="112" y="104" width="8" height="4" rx="2" fill="#ea4335"/>
  <!-- Text -->
  <text x="100" y="126" text-anchor="middle" font-family="Arial, sans-serif" font-size="13" font-weight="700" fill="#ffffff" letter-spacing="2">GKE PRO</text>
  <text x="100" y="143" text-anchor="middle" font-family="Arial, sans-serif" font-size="7.5" fill="rgba(255,255,255,0.65)" letter-spacing="0.5">GOOGLE KUBERNETES</text>
  <text x="100" y="154" text-anchor="middle" font-family="Arial, sans-serif" font-size="7.5" fill="rgba(255,255,255,0.65)" letter-spacing="0.5">ENGINE PROFESSIONAL</text>
  <text x="100" y="168" text-anchor="middle" font-family="Arial, sans-serif" font-size="6.5" fill="rgba(66,133,244,0.8)" letter-spacing="0.5">GOOGLE CLOUD</text>
</svg>
